name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore WakeNetServer.Server/WakeNetServer.Server.csproj
          dotnet restore WakeNetServer.Tests/WakeNetServer.Tests.csproj

      - name: Build
        run: |
          dotnet build WakeNetServer.Server/WakeNetServer.Server.csproj -c Release --no-restore
          dotnet build WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --no-restore

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-backend
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore WakeNetServer.Tests/WakeNetServer.Tests.csproj

      - name: List tests
        run: dotnet test WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --list-tests

      - name: Run unit tests
        run: dotnet test WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"