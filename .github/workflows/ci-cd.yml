name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore WakeNetServer.Server/WakeNetServer.Server.csproj
          dotnet restore WakeNetServer.Tests/WakeNetServer.Tests.csproj

      - name: Build
        run: |
          dotnet build WakeNetServer.Server/WakeNetServer.Server.csproj -c Release --no-restore
          dotnet build WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --no-restore

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-backend
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore WakeNetServer.Tests/WakeNetServer.Tests.csproj

      - name: List tests
        run: dotnet test WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --list-tests

      - name: Run unit tests
        run: dotnet test WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  cd-deploy:
    name: CD - Deploy to GCE
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Auth to Google Cloud (recommended: Workload Identity Federation).
      # Required secrets:
      # - GCP_WIF_PROVIDER: projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
      # - GCP_SERVICE_ACCOUNT: <name>@<project>.iam.gserviceaccount.com
      #
      # Alternative (not recommended): use a JSON key via secrets.GCP_SA_KEY_JSON and google-github-actions/auth@v2 with credentials_json.
      - name: Google auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_AR_REGION }}-docker.pkg.dev" --quiet

      - name: Build & push image (FE+BE)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          AR_REGION: ${{ secrets.GCP_AR_REGION }}
          AR_REPO: ${{ secrets.GCP_AR_REPO }}
          IMAGE_NAME: ${{ secrets.GCP_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -f ./Gcp-deploy/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update VM metadata + restart (pull latest image)
        env:
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          ZONE: ${{ secrets.GCP_ZONE }}
          PUBLIC_PORT: "80"
          CONTAINER_PORT: "5000"
        run: |
          gcloud compute instances add-metadata "$VM_NAME" \
            --zone "$ZONE" \
            --metadata-from-file startup-script=Gcp-deploy/startup.sh \
            --metadata "wakenet_image=${IMAGE},wakenet_container_port=${CONTAINER_PORT},wakenet_public_port=${PUBLIC_PORT}" \
            --quiet
          gcloud compute instances reset "$VM_NAME" --zone "$ZONE" --quiet

      - name: Show external IP
        env:
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          ZONE: ${{ secrets.GCP_ZONE }}
        run: |
          echo "External IP:"
          gcloud compute instances describe "$VM_NAME" --zone "$ZONE" --format="get(networkInterfaces[0].accessConfigs[0].natIP)"