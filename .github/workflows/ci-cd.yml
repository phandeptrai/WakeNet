name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore WakeNetServer.Server/WakeNetServer.Server.csproj
          dotnet restore WakeNetServer.Tests/WakeNetServer.Tests.csproj

      - name: Build
        run: |
          dotnet build WakeNetServer.Server/WakeNetServer.Server.csproj -c Release --no-restore
          dotnet build WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test WakeNetServer.Tests/WakeNetServer.Tests.csproj -c Release --no-build --verbosity normal